<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.png" type="image/png">
  <title>Audio-player</title>
</head>
<body>
  <div class="wrapper">
    <div class="audio-container">
      <div class="slider-container">
        <div class="slider">
          <img src="./assets/images/Alan Walker, SoranaCatch Me If You Can.jpg" alt="1" class="slider-img">
          <img src="./assets/images/ascend.jpg" alt="2" class="slider-img">
          <img src="./assets/images/GaullinMoonlight.jpg" alt="3" class="slider-img">
        </div>        
      </div>
      <div class="control-container">
        <audio src="./assets/audio/Dezko - Ascend.mp3" controls></audio>
      </div>
    </div>
    <footer>
      <div class="footer-left">2023</div>
      <a class="footer-center" href="https://rs.school/js-stage0/">
        <img class="footer-logo" src="./assets/icon/rs_school.svg" alt="rs_school.svg">
      </a>
      <a class="footer-right" href="https://github.com/Eugen270181/">Eugen Sadovnikov</a>
    </footer>
  </div>
  <script src="main.js"></script>
</body>
</html>
